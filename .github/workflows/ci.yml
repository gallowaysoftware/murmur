name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-build-and-test:
    name: Go (build + unit tests)
    runs-on: ubuntu-latest
    # Build + tests only; all linting (incl. gofmt + go vet) is the
    # golangci-lint job's responsibility. Previously this job ran
    # gofmt-check + go vet too, but those duplicate the golangci-lint
    # `gofmt` formatter + `govet` linter — see .golangci.yml.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        # The web/ build pipeline isn't run in CI; place a stub so
        # pkg/admin/embed.go's go:embed directive resolves to a known path.
        # Workspace mode: go.work composes the root module with
        # pkg/exec/batch/sparkconnect (its own module so non-Spark
        # consumers don't have to mirror the spark-connect-go fork-replace).
        run: |
          mkdir -p pkg/admin/dist
          [ -f pkg/admin/dist/README.md ] || echo placeholder > pkg/admin/dist/README.md
          go build ./...
          (cd pkg/exec/batch/sparkconnect && go build ./...)

      - name: unit tests
        run: |
          go test -short -race -timeout 120s ./...
          (cd pkg/exec/batch/sparkconnect && go test -short -race -timeout 120s ./...)

  go-latest-toolchain:
    name: Go (latest stable toolchain)
    runs-on: ubuntu-latest
    # Canary lane. Every other Go job pins `go-version-file: go.mod`, so a
    # dependency that compiles under the pinned toolchain but breaks under a
    # NEWER one is invisible to CI by construction. That is not theoretical:
    # Go 1.27 switched golang.org/x/net/http2 to a stdlib-delegating wrapper
    # (`//go:build !(go1.27 && !http2legacy)`), which dropped the
    # `http2.TrailerPrefix` export that google.golang.org/grpc references — so
    # murmur did not build on Go 1.27 at all while CI stayed fully green.
    # This job tracks whatever Go is current and fails loudly when that
    # recurs. Keep it a hard gate, not `continue-on-error`.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: stub embed dir
        run: |
          mkdir -p pkg/admin/dist
          [ -f pkg/admin/dist/README.md ] || echo placeholder > pkg/admin/dist/README.md

      - name: go build
        run: |
          go build ./...
          (cd pkg/exec/batch/sparkconnect && go build ./...)

      - name: unit tests
        run: |
          go test -short -race -timeout 120s ./...
          (cd pkg/exec/batch/sparkconnect && go test -short -race -timeout 120s ./...)

  e2e:
    name: Library-shape E2E (test/e2e)
    runs-on: ubuntu-latest
    # The nine-file suite in test/e2e — counter, HLL, windowed, Mongo
    # bootstrap, Mongo CDC, DDB bootstrap, S3 replay, S3 Parquet replay, Kafka
    # concurrency — had never run in CI. README.md advertises it and
    # doc/design.md claimed "The CI runs them on every PR", which was false:
    # it ran only through `make test-integration`, i.e. when someone
    # remembered to do it locally with docker-compose up.
    #
    # These are the LIBRARY-shape tests: murmur used as a Go package against
    # real infra. The `integration` job is the DEPLOYED-shape suite: built
    # container images run as containers. They catch different classes of bug
    # and both are worth running.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: stub embed dir
        run: |
          mkdir -p pkg/admin/dist
          [ -f pkg/admin/dist/README.md ] || echo placeholder > pkg/admin/dist/README.md

      - name: start infra
        # Only the services test/e2e reads: DDB_LOCAL_ENDPOINT, KAFKA_BROKERS,
        # MONGO_URI, S3_ENDPOINT. valkey and spark-connect are omitted — nothing
        # under test/e2e gates on them, and spark-connect is a slow image whose
        # own e2e lives in the sparkconnect submodule.
        run: docker compose up -d kafka dynamodb-local mongo minio

      - name: wait for infra
        # MUST come before the replset init: `docker compose up -d` returns as
        # soon as the containers are created, not when the daemons inside them
        # accept connections. Running rs.initiate() against a mongod that is
        # still starting fails.
        #
        # (`make compose-up` has the same ordering bug but hides it behind
        # `|| true`, so a failed replset init is silent there and the Mongo CDC
        # tests just skip.)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ok=1
            # dynamodb-local answers 400 to a bare GET, so `curl -f` fails on a
            # HEALTHY server. Any HTTP status back means the port is serving.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000 || echo 000)
            [ "$code" != "000" ] || ok=0
            curl -fsS --max-time 5 http://localhost:9000/minio/health/live >/dev/null 2>&1 || ok=0
            docker exec murmur-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 || ok=0
            docker exec murmur-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || ok=0
            if [ "$ok" = "1" ]; then echo "infra ready after $i attempt(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::infra did not become ready"
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: init mongo replica set
        # Change Streams require a replica set; pkg/source/snapshot/mongo's
        # HandoffToken capture depends on it. The script is idempotent.
        run: ./scripts/init-mongo-replset.sh

      - name: wait for replica set to elect a primary
        # rs.initiate() returns before the election completes. Connecting with
        # replicaSet=rs0 against a set with no primary yet fails, and the CDC
        # tests would skip rather than run.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec murmur-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "replica set has a primary after $i attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::replica set never elected a primary"
          docker exec murmur-mongo mongosh --quiet --eval 'rs.status()' || true
          exit 1

      - name: e2e tests
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000
          KAFKA_BROKERS: localhost:9092
          S3_ENDPOINT: http://localhost:9000
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
        # Piped through the assertion script so a SKIP fails the job. These
        # tests skip themselves when their env vars are unset, which makes
        # "ran nothing" and "everything passed" the same exit code — the exact
        # failure mode that let this suite rot unnoticed.
        run: |
          set -euo pipefail
          go test -timeout 20m -json ./test/e2e/... | tee /tmp/e2e.jsonl | grep -E '"Action":"(fail|output)"' || true
          python3 scripts/assert-tests-ran.py < /tmp/e2e.jsonl

      - name: dump infra logs on failure
        if: failure()
        run: docker compose logs --tail=200

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Sole lint authority: runs the v2 lint surface (govet, errcheck,
    # ineffassign, revive, staticcheck, unused, unparam, misspell,
    # gocritic) plus the gofmt formatter, covering what the old Go
    # job used to duplicate. Run twice: once for the root module,
    # once for the sparkconnect submodule (golangci-lint doesn't
    # follow go.work).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: stub embed dir
        run: |
          mkdir -p pkg/admin/dist
          echo placeholder > pkg/admin/dist/README.md
      - name: lint root module
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`. A floating linter makes CI
          # non-reproducible: the same commit that passed in May can go red in
          # August because the action pulled a newer release with new checks.
          version: v2.13.1
          args: --timeout=5m
      - name: lint sparkconnect submodule
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`. A floating linter makes CI
          # non-reproducible: the same commit that passed in May can go red in
          # August because the action pulled a newer release with new checks.
          version: v2.13.1
          working-directory: pkg/exec/batch/sparkconnect
          args: --timeout=5m

  web:
    name: Web UI (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 (active LTS). Kept in lockstep with web/package.json's
          # `engines.node` and the `@types/node` major — typing against a
          # newer Node than the one that executes lets tsc accept APIs that
          # do not exist at runtime.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generate proto bindings
        # web/src/gen/ is .gitignored — TS bindings are regenerated from
        # ../proto via the buf config in web/buf.gen.yaml. Must run before
        # tsc / lint / build so the generated module paths exist.
        run: npx buf generate
      - name: typecheck
        run: npx tsc -b --noEmit
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build

  integration:
    name: Deployed-shape integration (testcontainers)
    runs-on: ubuntu-latest
    # Parallel to the other jobs above. Builds the example Docker
    # images and runs them as containers against Kafka + DynamoDB-local
    # containers; catches what the in-process e2e tests can't see
    # (broken Dockerfiles, env-var schema drift, container networking
    # config mistakes).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: stub embed dir
        # pkg/admin/embed.go's go:embed needs the dist directory to
        # exist — the example Dockerfiles `go build` into a multi-stage
        # image that imports pkg/admin transitively.
        run: |
          mkdir -p pkg/admin/dist
          echo placeholder > pkg/admin/dist/README.md

      - name: integration tests
        # The `integration` build tag gates these tests out of the
        # default `go test ./...` run. Locally: `make test-deployed`.
        run: go test -tags=integration -timeout 15m -v ./test/integration/...
